<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人展示平台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

    /* 导航 */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 23, 42, .9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    nav .container { display: flex; align-items: center; justify-content: space-between; height: 56px; }
    nav .logo { font-weight: 700; color: var(--text); }
    nav .links a { color: var(--muted); margin-left: 20px; font-size: 15px; }
    nav .links a:hover { color: var(--accent); text-decoration: none; }

    /* Hero */
    header.hero { padding: 80px 0 60px; text-align: center; }
    .avatar {
      width: 110px; height: 110px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 700; color: #fff; margin-bottom: 20px;
    }
    .hero h1 { font-size: 34px; margin-bottom: 8px; }
    .hero .tagline { color: var(--muted); font-size: 18px; margin-bottom: 6px; }
    .hero .school { color: var(--accent); font-size: 15px; }
    .contact { margin-top: 18px; font-size: 14px; color: var(--muted); }
    .contact span { margin: 0 10px; }

    /* 通用区块 */
    section { padding: 48px 0; }
    section h2 {
      font-size: 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px;
    }
    section h2::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }

    /* 关于我 */
    .about-text { color: var(--muted); white-space: pre-line; }

    /* 技能 */
    .skill-group { margin-bottom: 18px; }
    .skill-group h3 { font-size: 16px; margin-bottom: 10px; color: var(--text); }
    .tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px; font-size: 14px; color: var(--text);
    }

    /* 项目 */
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .project {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column;
      transition: transform .2s, border-color .2s;
    }
    .project:hover { transform: translateY(-4px); border-color: var(--accent); }
    .project h3 { font-size: 18px; margin-bottom: 8px; }
    .project .desc { color: var(--muted); font-size: 14px; flex: 1; }
    .project .tags { margin-top: 12px; }
    .project .tag { font-size: 12px; padding: 3px 10px; }
    .project .links { margin-top: 14px; font-size: 14px; }
    .project .links a { margin-right: 14px; }

    /* 经历时间线 */
    .timeline { border-left: 2px solid var(--border); padding-left: 24px; }
    .timeline .item { position: relative; margin-bottom: 24px; }
    .timeline .item::before {
      content: ""; position: absolute; left: -31px; top: 8px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
    }
    .timeline .item .time { color: var(--accent); font-size: 13px; }
    .timeline .item h3 { font-size: 16px; }
    .timeline .item p { color: var(--muted); font-size: 14px; }

    footer { border-top: 1px solid var(--border); padding: 24px 0; text-align: center; color: var(--muted); font-size: 14px; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 26px; }
      nav .links a { margin-left: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <span class="logo" id="nav-name">个人主页</span>
      <div class="links">
        <a href="#about">关于我</a>
        <a href="#skills">技能</a>
        <a href="#projects">项目</a>
        <a href="#experience">经历</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <div class="avatar" id="hero-avatar">?</div>
      <h1 id="hero-name">你的名字</h1>
      <p class="tagline" id="hero-tagline"></p>
      <p class="school" id="hero-school"></p>
      <div class="contact" id="hero-contact"></div>
    </div>
  </header>

  <section id="about">
    <div class="container">
      <h2>关于我</h2>
      <p class="about-text" id="about-text"></p>
    </div>
  </section>

  <section id="skills">
    <div class="container">
      <h2>技能</h2>
      <div id="skill-list"></div>
    </div>
  </section>

  <section id="projects">
    <div class="container">
      <h2>项目经历</h2>
      <div class="project-grid" id="project-list"></div>
    </div>
  </section>

  <section id="experience">
    <div class="container">
      <h2>教育与经历</h2>
      <div class="timeline" id="experience-list"></div>
    </div>
  </section>

  <footer>
    <div class="container" id="footer-text"></div>
  </footer>

  <script src="data.js"></script>
  <script>
    (function () {
      const d = window.SITE_DATA;

      // Hero
      document.title = d.name + " - 个人主页";
      document.getElementById("nav-name").textContent = d.name;
      document.getElementById("hero-name").textContent = d.name;
      document.getElementById("hero-avatar").textContent = d.avatarText || d.name.charAt(0);
      document.getElementById("hero-tagline").textContent = d.tagline || "";
      document.getElementById("hero-school").textContent = d.school || "";
      document.getElementById("hero-contact").innerHTML = (d.contacts || [])
        .map(c => "<span>" + esc(c.label || c.text) + ": " + linkify(c.text) + "</span>").join("");

      // 关于我
      document.getElementById("about-text").textContent = d.about || "";

      // 技能
      document.getElementById("skill-list").innerHTML = (d.skills || [])
        .map(g => '<div class="skill-group"><h3>' + esc(g.name) + '</h3><div class="tags">'
          + g.items.map(i => '<span class="tag">' + esc(i) + '</span>').join("") + '</div></div>').join("");

      // 项目
      document.getElementById("project-list").innerHTML = (d.projects || [])
        .map(p => '<div class="project"><h3>' + esc(p.name) + '</h3>'
          + '<p class="desc">' + esc(p.description || "") + '</p>'
          + (p.tech && p.tech.length ? '<div class="tags">' + p.tech.map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</div>' : "")
          + '<div class="links">' + (p.links || []).map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>').join("") + '</div></div>').join("");

      // 经历
      document.getElementById("experience-list").innerHTML = (d.experience || [])
        .map(e => '<div class="item"><div class="time">' + esc(e.time) + '</div><h3>' + esc(e.title)
          + '</h3><p>' + esc(e.description || "") + '</p></div>').join("");

      // Footer
      document.getElementById("footer-text").innerHTML = d.footer || ("© " + new Date().getFullYear() + " " + esc(d.name));

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
      }
      function linkify(text) {
        const s = esc(text);
        return /^https?:\/\//.test(text) ? '<a href="' + s + '" target="_blank" rel="noopener">' + s + '</a>' : s;
      }
    })();
  </script>
</body>
</html>
